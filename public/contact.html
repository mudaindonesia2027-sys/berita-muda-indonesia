<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontak — Berita Muda Indonesia</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="top">BERITA MUDA INDONESIA <span>Informasi Cepat, Akurat</span></div><nav><a href="/">BERANDA</a><a href="/tentang-kami">TENTANG</a><a href="/kontak">KONTAK</a></nav></header><main><section class="detail legal"><div class="badge">KONTAK</div><h1>Hubungi Berita Muda Indonesia</h1><p>Untuk iklan, sponsor, kerja sama, koreksi berita, hak cipta, atau pertanyaan umum, kirim pesan langsung lewat formulir ini.</p><form id="contactForm" style="display:grid;gap:12px;max-width:760px"><label>Nama<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Perusahaan / Brand<input name="company"></label><label>Telepon / WhatsApp<input name="phone"></label><label>Keperluan<select name="inquiry_type"><option value="iklan">Iklan</option><option value="sponsor">Sponsor</option><option value="kerja_sama">Kerja sama</option><option value="koreksi">Koreksi berita</option><option value="hak_cipta">Hak cipta</option><option value="general">Pertanyaan umum</option><option value="lainnya">Lainnya</option></select></label><label>Subjek<input id="contactSubject" name="subject"></label><label>Pesan<textarea name="message" rows="6" required></textarea></label><label>Perkiraan anggaran (opsional)<input name="budget" type="number" min="0" step="1000"></label><button type="submit">Kirim pesan</button><div id="contactStatus"></div></form></section></main><footer>© 2026 Berita Muda Indonesia</footer><script>document.getElementById('contactSubject').value=new URLSearchParams(location.search).get('topic')==='iklan'?'Permintaan iklan':'';document.getElementById('contactForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,s=document.getElementById('contactStatus');const body=Object.fromEntries(new FormData(f).entries());body.source_path=location.pathname+location.search;s.textContent='Mengirim…';try{const r=await fetch('/api/contact/inquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal mengirim');s.textContent=d.message||'Pesan terkirim.';f.reset();}catch(err){s.textContent=err.message;}});</script></body></html>
